name: Bug Report
description: File a bug or unexpected behavior in a Fluidise tool or repository
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component or Repository
      description: Which repository or tool does this issue relate to?
      options:
        - "Fluidise/clint (fluidise-clint CLI or crate)"
        - "Fluidise/homebrew-tap (Homebrew formulas)"
        - "Fluidise/core (Core standards and schemas)"
        - "Fluidise/.github (Organization profiles and templates)"
        - "Other / General"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool Version / Environment
      description: Tool version (e.g. `fluidise-clint --version`), OS, and architecture.
      placeholder: "e.g. fluidise-clint v0.1.0 on macOS Sequoia (Apple Silicon) / Linux x86_64"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions or minimal command lines to reproduce the behavior.
      placeholder: |
        1. Run `echo "invalid commit" | fluidise-clint`
        2. Observe exit code and output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen according to Fluidise invariants and schemas.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic Output or JSON Logs
      description: Paste terminal output, error logs, or JSON diagnostic outputs here.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Invariant Checks
      options:
        - label: I confirmed this issue occurs with the latest release.
          required: false
        - label: No sensitive credentials, tokens, or private data are present in the logs.
          required: true
