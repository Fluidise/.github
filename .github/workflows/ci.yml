name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress './**/*.md'
          fail: true

  lint-commits:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install fluidise-clint
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # Attempt to retrieve precompiled fluidise-clint binary from releases
          if curl -sLf https://github.com/Fluidise/clint/releases/latest/download/fluidise-clint-x86_64-unknown-linux-musl.tar.gz -o /tmp/clint.tar.gz 2>/dev/null; then
            tar -xzf /tmp/clint.tar.gz -C "$HOME/.local/bin/" || true
          fi

      - name: Validate PR Commits
        run: |
          COMMITS=$(git log --format="%s" origin/${{ github.base_ref }}..HEAD)
          echo "Validating commits against Conventional Commits 1.0.0:"
          echo "$COMMITS"
          FAILED=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if command -v fluidise-clint &>/dev/null; then
              echo "$msg" | fluidise-clint --format text || FAILED=1
            else
              # Fallback validation for Conventional Commits
              if ! echo "$msg" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_.-]+\))?(!)?: .+'; then
                echo "❌ Invalid Conventional Commit format: $msg"
                FAILED=1
              else
                echo "✅ Valid commit format: $msg"
              fi
            fi
          done <<< "$COMMITS"
          exit $FAILED
