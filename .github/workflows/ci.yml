name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude 'https://github.com/Fluidise/core' './**/*.md'
          fail: true

  lint-commits:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate PR Title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          CONVENTIONAL_REGEX='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?!?: .+$'
          if ! printf '%s\n' "$PR_TITLE" | grep -qE "$CONVENTIONAL_REGEX"; then
            echo "❌ PR title does not adhere to Conventional Commits: '$PR_TITLE'" >&2
            echo "Expected: <type>(<optional scope>)[!]: <description>" >&2
            exit 1
          fi
          echo "✅ PR title is valid: '$PR_TITLE'"

      - name: Validate PR Commits
        run: |
          COMMITS=$(git log --no-merges --format="%s" origin/${{ github.base_ref }}..HEAD)
          echo "Validating commits against Conventional Commits 1.0.0:"
          echo "$COMMITS"
          FAILED=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if command -v fluidise-clint &>/dev/null; then
              echo "$msg" | fluidise-clint --format text || FAILED=1
            else
              CONVENTIONAL_REGEX='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_.-]+\))?(!)?: .+'
              if ! echo "$msg" | grep -Eq "$CONVENTIONAL_REGEX"; then
                echo "❌ Invalid Conventional Commit format: $msg"
                FAILED=1
              else
                echo "✅ Valid commit format: $msg"
              fi
            fi
          done <<< "$COMMITS"
          exit $FAILED
